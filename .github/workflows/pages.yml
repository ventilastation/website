name: Deploy Jekyll Site

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ROM generator dependencies
        run: python3 -m pip install -r vsdk/requirements.txt -r vsdk/docs/requirements.txt

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Generate emulator publish tree
        run: |
          make publish

      - name: Build with Jekyll
        run: bundle exec jekyll build --destination ./_site

      # Build after Jekyll: Sphinx output must not be interpreted as Jekyll input.
      - name: Build shared SDK documentation
        env:
          VSDK_DOCS_BASEURL: ${{ steps.pages.outputs.base_url }}/docs/
        run: |
          python3 -m sphinx -b html -W --keep-going vsdk/docs _site/docs
          python3 vsdk/tools/check_docs.py _site/docs

      - name: Check content editing and published files
        run: python3 tools/test-content.py --site _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
