<section id="two" class="wrapper alt style2">
  {% for game in include.games %}
    <section class="spotlight">
      <div class="fanshot">
        <img src="{{ game.image | escape }}" alt="{{ game.image_alt | escape }}" />
      </div>
      <div class="content">
        <img src="{{ game.controls_image | escape }}" width="{{ game.controls_width | escape }}" alt="{{ game.controls_alt | escape }}" />
      </div>
    </section>
  {% endfor %}
</section>
